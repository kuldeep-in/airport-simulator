[project]
name = "airport-simulator"
version = "0.1.0"
description = "Hamad International Airport Real-Time Simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "databricks-sdk>=0.30.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
